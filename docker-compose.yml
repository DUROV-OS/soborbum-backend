services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soborbum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: soborbum
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soborbum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET in .env}
      STORAGE_DIR: /app/storage
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@soborbum.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-Administrator}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      UVICORN_RELOAD: ${UVICORN_RELOAD:-0}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_REDIRECT_URI: ${MCP_REDIRECT_URI:-http://127.0.0.1:8005/callback}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:8005:8000"

volumes:
  db_data:
  storage_data:
